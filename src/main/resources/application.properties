# ===================================================================
# SERVER & TOMCAT
# ===================================================================
server.port=${PORT:7085}
server.server-header=
server.forward-headers-strategy=framework
server.max-http-request-header-size=64KB

# ===================================================================
# APPLICATION & ENV IMPORT
# ===================================================================
spring.application.name=leaderboard-java
spring.config.import=optional:file:.env[.properties]
spring.threads.virtual.enabled=true

# ===================================================================
# DATASOURCE (PostgreSQL & HikariCP)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:worldpinball}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# REDIS (NoSQL Cache, ZSET Leaderboards, Matchmaking, Idempotency)
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms

# ===================================================================
# APACHE KAFKA (Producer & Consumer)
# ===================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.batch.size=1048576

spring.kafka.consumer.group-id=worldpinball-leaderboard-updater
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:false}

# ===================================================================
# ACTUATOR, PROMETHEUS & OPENTELEMETRY
# ===================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORTER_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

# ===================================================================
# LOGGING (SLF4J / Logback MDC Correlation)
# ===================================================================
logging.pattern.level=%5p [${spring.application.name:},%X{CorrelationId:-},%X{GameSessionId:-}]
logging.level.root=INFO
logging.level.com.worldpinball.leaderboard=DEBUG

# ===================================================================
# gRPC SERVER
# ===================================================================
grpc.server.port=${GRPC_PORT:9090}
grpc.server.permit-keep-alive-without-calls=true
grpc.server.permit-keep-alive-time-in-nanos=30000000000

