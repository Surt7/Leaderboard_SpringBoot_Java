name: worldpinball-java-prod

services:
  # 0. Nginx Gateway & Angular SPA Host (Public entry point)
  nginx:
    image: nginx:1.27-alpine
    container_name: worldpinball-java-prod-nginx
    ports:
      - "8088:80"
      # - "8443:443" # Uncomment when SSL certificates (Let's Encrypt / Certbot) are mounted
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./frontend/dist/browser:/usr/share/nginx/html:ro # Mounted compiled Angular files
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  # 1. Core Spring Boot Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worldpinball-java-prod-api
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=worldpinball
      - DB_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  # 2. PostgreSQL Database
  db:
    image: postgres:16.15-alpine
    container_name: worldpinball-java-prod-db
    environment:
      POSTGRES_DB: worldpinball
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - worldpinball_java_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worldpinball"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  # 3. Redis Cache
  redis:
    image: redis:8.10.1-alpine
    container_name: worldpinball-java-prod-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - worldpinball_java_prod_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  # 4. OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: worldpinball-java-prod-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/prod/otel-collector.prod.yml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  # 5. Keycloak Database
  keycloak-db:
    image: postgres:16.15-alpine
    container_name: worldpinball-java-prod-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
    volumes:
      - worldpinball_java_prod_keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  # 6. Keycloak Production IAM
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: worldpinball-java-prod-keycloak
    command: start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
      KC_HOSTNAME: https://auth.${DOMAIN:?DOMAIN must be set}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./docker/keycloak/worldpinball-realm.prod.json:/opt/keycloak/data/import/worldpinball-realm.prod.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - worldpinball-java-network

volumes:
  worldpinball_java_prod_pgdata:
  worldpinball_java_prod_redisdata:
  worldpinball_java_prod_keycloak_pgdata:

networks:
  worldpinball-java-network:
    driver: bridge
