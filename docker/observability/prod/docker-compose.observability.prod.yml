name: worldpinball-java-observability-prod

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: worldpinball-java-prod-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.prod.yml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: worldpinball-java-prod-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.prod.yml:/etc/tempo.yaml:ro
      - tempo_java_prod_data:/var/tempo
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: worldpinball-java-prod-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_java_prod_data:/prometheus
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  loki:
    image: grafana/loki:3.2.0
    container_name: worldpinball-java-prod-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki.prod.yml:/etc/loki/local-config.yaml:ro
      - loki_java_prod_data:/loki
    restart: unless-stopped
    networks:
      - worldpinball-java-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: worldpinball-java-prod-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_java_prod_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - tempo
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - worldpinball-java-network

volumes:
  tempo_java_prod_data:
  prometheus_java_prod_data:
  loki_java_prod_data:
  grafana_java_prod_data:

networks:
  worldpinball-java-network:
    external: true
