global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'spring-boot-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:7085', 'host.docker.internal:7085']

  - job_name: 'spring-cloud-bff'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['bff:8085', 'host.docker.internal:8085']
