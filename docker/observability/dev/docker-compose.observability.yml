name: worldpinball-java-observability-dev

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: worldpinball-java-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "4327:4317" # OTLP gRPC (Java)
      - "4328:4318" # OTLP HTTP (Java)
      - "8890:8889" # Prometheus metrics scraped by Prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempo
      - loki
    networks:
      - default
      - app-net
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: worldpinball-java-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
    ports:
      - "3201:3200" # Tempo HTTP (Java)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: worldpinball-java-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - app-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: worldpinball-java-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3101:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: worldpinball-java-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - tempo
      - prometheus
      - loki
    restart: unless-stopped

networks:
  default:
  app-net:
    name: worldpinball-java-dev_default
    external: true
