events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # -------------------------------------------------------------------------
    # Upstream Services
    # Connects to containers or falls back to host.docker.internal for local run
    # -------------------------------------------------------------------------
    upstream bff_upstream {
        server bff:8085;
        server host.docker.internal:8085 backup;
        keepalive 32;
    }

    upstream api_upstream {
        server api:7085;
        server host.docker.internal:7085 backup;
        keepalive 32;
    }

    upstream keycloak_upstream {
        server keycloak:8080;
        server host.docker.internal:8082 backup;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # 1. Main Gateway Domain: worldpinball.local
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name worldpinball.local localhost;

        # BFF / Gateway Routes
        location / {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Core API Direct Access
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # WebSocket Streaming
        location ~ ^/(ws|hubs)/ {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # -------------------------------------------------------------------------
    # 2. Subdomain: bff.worldpinball.local
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name bff.worldpinball.local;

        location / {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location ~ ^/(ws|hubs)/ {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # -------------------------------------------------------------------------
    # 3. Subdomain: api.worldpinball.local
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name api.worldpinball.local;

        location / {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # -------------------------------------------------------------------------
    # 4. Subdomain: auth.worldpinball.local (Keycloak Identity Provider)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name auth.worldpinball.local;

        location / {
            proxy_pass http://keycloak_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
