events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    client_max_body_size 50M;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    large_client_header_buffers 4 32k;

    # SSL global settings
    ssl_certificate /etc/nginx/certs/worldpinball.local.crt;
    ssl_certificate_key /etc/nginx/certs/worldpinball.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # WebSocket connection upgrade mapping for WebFlux, SignalR and Angular HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker internal DNS resolver (auto-detects container IP changes)
    resolver 127.0.0.11 ipv6=off valid=5s;

    # -------------------------------------------------------------------------
    # Upstreams targeting local host development services or container network
    # -------------------------------------------------------------------------
    upstream bff_upstream {
        least_conn;
        server bff:8085;
        server host.docker.internal:8085 backup;
        keepalive 32;
    }

    upstream api_upstream {
        least_conn;
        server api:7085;
        server host.docker.internal:7085 backup;
        keepalive 32;
    }

    upstream api_grpc_upstream {
        least_conn;
        server api:9090;
        server host.docker.internal:9090 backup;
        keepalive 32;
    }

    upstream auth_upstream {
        server keycloak:8080;
        server host.docker.internal:8082 backup;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80;
        server host.docker.internal:4200 backup;
        keepalive 32;
    }

    # Common reverse proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS redirect for all *.worldpinball.local domains
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name worldpinball.local *.worldpinball.local localhost;
        return 301 https://$host$request_uri;
    }

    # 1. AUTH DOMAIN: auth.worldpinball.local (Keycloak IAM)
    server {
        listen 443 ssl;
        server_name auth.worldpinball.local;

        location / {
            proxy_pass http://auth_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # 2. CORE API DOMAIN: api.worldpinball.local (Backend Core API)
    server {
        listen 443 ssl;
        http2 on;
        server_name api.worldpinball.local;

        # Ask clients for certificate if they have one (mTLS for pinball machines)
        ssl_verify_client optional_no_ca;

        # gRPC GameSessionService pass
        location /worldpinball.gamesessions.v1.GameSessionService/ {
            grpc_pass grpc://api_grpc_upstream;
            grpc_set_header Host $host;
            grpc_set_header X-Forwarded-Proto https;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        # REST Endpoints
        location / {
            proxy_pass http://api_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header Connection "";
        }
    }

    # 3. BFF DOMAIN: bff.worldpinball.local (Gateway & WebSockets)
    server {
        listen 443 ssl;
        server_name bff.worldpinball.local;

        # WebSockets (Lobby / Telemetry)
        location ~ ^/(ws|hubs)/ {
            proxy_pass http://bff_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://bff_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # 4. UNIFIED DOMAIN: worldpinball.local (Angular SPA + BFF)
    server {
        listen 443 ssl;
        server_name worldpinball.local;

        # API & Authentication BFF routes
        location ~ ^/(api|oauth2|login|signin-oidc|signout-callback-oidc) {
            proxy_pass http://bff_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # WebSockets
        location ~ ^/(ws|hubs)/ {
            proxy_pass http://bff_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }

        # Frontend Angular SPA (Container or local fallback)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Cookie ""; # Strip cookies for static assets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
