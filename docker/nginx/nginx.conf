events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # 1. SECURITY HARDENING (Firewall & Anti-Fingerprinting)
    # -------------------------------------------------------------------------
    server_tokens off;
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # 2. PERFORMANCE OPTIMIZATIONS
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    upstream api_service {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;

        server_name worldpinball.yourdomain.com localhost;

        root /usr/share/nginx/html;
        index index.html;

        limit_conn conn_limit 20;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/(api|bff|signin-oidc|signout-callback-oidc)/ {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }
}
