# ==============================================================================
# Docker Compose Development Override
# Usage:
#   1. Regular dev (infra only in Docker, run apps in IDE to save RAM):
#      docker compose up -d
#
#   2. Near-Prod testing with SSL & fake domains (run API & BFF in containers):
#      docker compose --profile apps up -d --build
#
#   3. Reverse proxy only (test local apps against https://*.worldpinball.local):
#      docker compose --profile nginx up -d
#
#   4. Hot Watch mode (syncs compiled classes into running containers):
#      docker compose --profile apps alpha watch
# ==============================================================================

services:
  # Local development reverse proxy for fake domains topology (*.worldpinball.local)
  dev-nginx:
    image: nginx:1.27-alpine
    container_name: worldpinball-java-dev-nginx
    profiles: ["nginx", "apps"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/dev-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      default:
        aliases:
          - auth.worldpinball.local
          - api.worldpinball.local
          - bff.worldpinball.local
          - worldpinball.local
    restart: unless-stopped

  # Core API service (containerized)
  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    image: worldpinball-java-api:dev
    container_name: worldpinball-java-api
    restart: unless-stopped
    environment:
      - PORT=7085
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - GRPC_PORT=9090
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=worldpinball
      - DB_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_LISTENER_AUTO_STARTUP=false
      - MANAGEMENT_HEALTH_SHOW_DETAILS=never
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/worldpinball/protocol/openid-connect/certs
      - OAUTH2_ISSUER_URI=https://auth.worldpinball.local/realms/worldpinball
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
      - OTEL_SERVICE_NAME=worldpinball-java-api
    ports:
      - "7085:7085"
      - "9090:9090"
    volumes:
      - ./docker/nginx/certs/dev-rootCA.pem:/app/certs/dev-rootCA.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./target/classes
          target: /app/classes
        - action: rebuild
          path: ./pom.xml

  # BFF Gateway service (containerized)
  bff:
    profiles: ["apps"]
    build:
      context: ../Leaderboard_Bff_Java
      dockerfile: Dockerfile
    image: worldpinball-java-bff:dev
    container_name: worldpinball-java-bff
    restart: unless-stopped
    environment:
      - PORT=8085
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - SERVER_MAX_HTTP_REQUEST_HEADER_SIZE=64KB
      - CORE_API_URL=http://api:7085
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OAUTH2_ISSUER_URI=https://auth.worldpinball.local/realms/worldpinball
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/app/certs/dev-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12
      - GRPC_CLIENT_GAMESESSIONSERVICE_ADDRESS=static://api:9090
      - GRPC_CLIENT_GAMESESSIONSERVICE_NEGOTIATION_TYPE=plaintext
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
      - OTEL_SERVICE_NAME=worldpinball-java-bff
    ports:
      - "8085:8085"
    volumes:
      - ./docker/nginx/certs/dev-rootCA.pem:/app/certs/dev-rootCA.pem:ro
      - ./docker/nginx/certs/dev-truststore.p12:/app/certs/dev-truststore.p12:ro
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      dev-nginx:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ../Leaderboard_Bff_Java/target/classes
          target: /app/classes
        - action: rebuild
          path: ../Leaderboard_Bff_Java/pom.xml

  # Allow Keycloak to accept requests from auth.worldpinball.local
  keycloak:
    environment:
      KC_HOSTNAME: "https://auth.worldpinball.local"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"

  # Angular Frontend SPA
  frontend:
    image: worldpinball-frontend:latest
    container_name: worldpinball-java-frontend
    profiles: ["frontend", "apps"]
    networks:
      default:
        aliases:
          - frontend
          - worldpinball-frontend
    restart: unless-stopped
